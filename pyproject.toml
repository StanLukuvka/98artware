[project]
name = "art98"
version = "0.1.0"
description = "Script animations with a real Windows 98 desktop inside a VM"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
art98 = "art98.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pycdlib>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["98artware_core/art98", "98artware_setup/art98_setup",
            "98artware_container/art98_container"]

[tool.pytest.ini_options]
testpaths = ["98artware_core/tests", "98artware_setup/tests", "98artware_container/tests"]
pythonpath = ["98artware_core", "98artware_setup", "98artware_container"]
markers = [
    "qemu: needs qemu-system-i386 on PATH",
    "container: needs Podman or Docker and the art98 image",
    "stage: boots the prepared image in work/ (or ART98_TEST_WORK)",
]
