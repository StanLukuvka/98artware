[project]
name = "art98"
version = "0.1.0"
description = "Script animations with a real Windows 98 desktop inside a VM"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["windows-98", "animation", "video", "qemu", "screen-capture", "retro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Repository = "https://github.com/StanLukuvka/98artware"

[project.scripts]
art98 = "art98.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pycdlib>=1.14", "ruff==0.17.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/art98", "setup/art98_setup"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "setup/tests"]
pythonpath = ["core", "setup"]
markers = [
    "qemu: needs qemu-system-i386 on PATH",
    "container: needs docker (or podman-docker) and the art98 image",
    "stage: boots the prepared image in work/ (or ART98_TEST_WORK)",
]

[tool.ruff]
extend-exclude = ["work"]
