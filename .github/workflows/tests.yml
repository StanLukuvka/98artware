name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg and mtools
        timeout-minutes: 8
        # When Ubuntu's mirrors are unreachable, the tests that need these tools skip themselves.
        continue-on-error: true
        run: |
          apt_opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y ffmpeg mtools
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check core setup tools
      - run: uv run python -m pytest core/tests setup/tests -q --ignore=core/tests/test_stage.py --ignore=core/tests/test_qemu.py
