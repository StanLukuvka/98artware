# art98 settings: every key is optional and shown with its default.
# Precedence: built-in default < this file < ART98_IMAGE (image only) < --work.
# How the containers run (product key, disc, VNC) is in compose.override.yaml instead.

[vm]
container = "art98-vm"                 # name of the long-lived container
image     = "localhost/art98:latest"   # image built by `art98 up`
work      = "work"                     # prepared image and vm.token; relative to this file

[ports]                                # HOST side, published on 127.0.0.1 only
control   = 7598                       # control/agent port, published only when the transport is tcp
